  - title: Research
    items:
      - when: 2025–present
        what: Modernizing bio-image analysis tools with PyTorch
        where: "Advisor: David Van Valen, California Institute of Technology"
        details:
          - "The Van Valen group's deep learning tools for segmenting and tracking high-dimensional biological images were built on TensorFlow. I am writing and implementing PyTorch versions of our models Mesmer, Caliban, and Polaris to improve stability and cross-platform performance."
      - when: 2024–present
        what: Repetitive element-based spatial barcoding for rapid high-throughput screening
        where: "Advisor: David Van Valen, California Institute of Technology"
        details:
          - "I am developing a spatial barcoding method that uses dCas9 and gRNAs to target repetitive elements in the genome, with the resulting patterns read out by multicolor FISH. A deep learning model trained on these patterns identifies gRNAs with 90–99% accuracy. The encoding space is limited only by the number of discernible patterns and FISH colors, and readout needs a single multicolor FISH step."
      - when: 2024–present
        what: Computational design and in vitro validation of novel metabolite biosensors
        where: "Advisor: David Van Valen, California Institute of Technology"
        details:
          - "Using computational protein design tools (RFdiffusion, LigandMPNN, AlphaFold), I am designing and testing novel sensing domains for fluorescent biosensors of less-studied metabolites involved in immune metabolism, to illuminate understudied aspects of metabolism as cells grow, divide, and differentiate."
      - when: 2020–2024
        what: Mapping the zinc requirements of the mammalian cell cycle
        where: "Advisor: Amy E. Palmer, University of Colorado Boulder"
        details:
          - "Mild to moderate zinc deficiency splits cell fate and increases the DNA damage response in cell culture, but no mechanism has been defined. My thesis research aims to decouple the causes, consequences, and sequence of events that drive zinc-deficient cells into quiescence."
      - when: 2020–2023
        what: Cellular dynamics of free zinc throughout the mammalian cell cycle
        where: "Advisor: Amy E. Palmer, University of Colorado Boulder"
        details:
          - "Using a genetically encoded FRET zinc sensor and long-term live-cell imaging of single cells, we identified zinc dynamics in the mammalian cell cycle, and monitored them after depletion of a transcription factor involved in the response to high zinc. I was responsible for data stewardship and analysis of terabytes of high-content live-cell imaging data."
      - when: 2018–2019
        what: Engineering Pseudomonas putida KT2440 for the valorization of lignin
        where: "Advisor: Adam Guss, Oak Ridge National Laboratory"
        details:
          - "Worked with a graduate student to engineer P. putida to catabolize lignin monomers into value-added chemicals. Developed and optimized extraction of fatty alcohols and polyhydroxyalkanoate monomers for GC-MS analysis, and maintained and troubleshot the group's GC-MS."
      - when: 2016–2018
        what: Biomarker analysis for validating Earth analogue sampling techniques
        where: "Advisor: Amanda Stockton, Georgia Institute of Technology"
        details:
          - "Cataloged and curated Icelandic tephra samples from field expeditions, developed a pipeline for DNA extraction from low-biomass samples and library preparation for 16S rRNA community analysis, and helped develop an in situ co-culturing chip for unculturable microbes. Joined a June–July 2018 field expedition to sample volcanic tephra from the Holuhraun lava field in the Icelandic highlands."

